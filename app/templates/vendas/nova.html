{% extends "base.html" %}
{% block title %}Nova Venda - Nana Lanches{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
    <h1 class="text-3xl font-bold mb-1 text-center">Nova Venda</h1>
    <p class="text-slate-500 text-center mb-6">Escolha o cliente pra começar</p>

    <form method="post" action="/vendas/nova" class="bg-white p-6 rounded shadow border-t-4 border-brand-500">
        <div class="relative">
            <div class="flex justify-between items-baseline mb-1">
                <label for="cliente_busca" class="block text-sm font-medium">Cliente</label>
                <a href="/clientes/novo?voltar=/vendas/nova" class="text-sm text-slate-600 underline">+ Novo cliente</a>
            </div>
            <input type="text" id="cliente_busca" value="{{ cliente_padrao.nome }}"
                   hx-get="/clientes/buscar" hx-trigger="keyup changed delay:300ms" hx-target="#resultado_busca_cliente"
                   name="termo" class="w-full border rounded px-3 py-3 text-lg" autocomplete="off"
                   onfocus="this.select()">
            <input type="hidden" id="cliente_id" name="cliente_id" value="{{ cliente_padrao.id }}">
            <div id="resultado_busca_cliente" class="absolute z-10 w-full mt-1 max-h-64 overflow-y-auto shadow-lg"></div>
        </div>
        <p class="text-sm text-slate-500 mt-2 mb-5">Deixe como está para venda ao consumidor final, ou digite para buscar um cliente já cadastrado.</p>
        <button type="submit" class="w-full bg-brand-500 text-white py-3 rounded font-bold text-lg">Iniciar venda</button>
    </form>
</div>
{% endblock %}
