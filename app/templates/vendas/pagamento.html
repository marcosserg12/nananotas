{% extends "base.html" %}
{% block title %}Pagamento - Orçamento {{ venda.numero_orcamento }}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Pagamento — Orçamento nº {{ venda.numero_orcamento }}</h1>

    <div class="bg-brand-500 text-white rounded shadow p-5 mb-4 flex justify-between items-center flex-wrap gap-2">
        <span class="text-lg font-medium">Valor total</span>
        <span class="text-4xl font-bold">R$ {{ "%.2f"|format(venda.valor_total) }}</span>
    </div>

    <form method="post" action="/vendas/{{ venda.id }}/pagamento" class="bg-white p-6 rounded shadow">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium mb-1">Forma de pagamento</label>
                <select name="forma_pagamento" id="forma_pagamento" class="w-full border rounded px-3 py-3 text-lg">
                    <option value="dinheiro">Dinheiro</option>
                    <option value="cartao_credito">Cartão de Crédito</option>
                    <option value="cartao_debito">Cartão de Débito</option>
                    <option value="pix">Pix</option>
                </select>
            </div>
            <div id="campo_bandeira" hidden>
                <label class="block text-sm font-medium mb-1">Bandeira</label>
                <select name="bandeira" class="w-full border rounded px-3 py-3 text-lg">
                    <option value="">Selecione...</option>
                    {% for codigo, nome in bandeiras.items() %}
                    <option value="{{ codigo }}">{{ codigo }} - {{ nome|upper }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Parcelas</label>
                <input type="number" name="numero_parcelas" value="1" min="1" class="w-full border rounded px-3 py-3 text-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Valor pago</label>
                <input type="text" name="valor_pago" value="{{ venda.valor_total }}" class="w-full border rounded px-3 py-3 text-lg">
            </div>
        </div>
        <button type="submit" class="w-full bg-emerald-700 text-white py-3 rounded font-bold text-lg">Confirmar venda</button>
    </form>
</div>
<script>
    (function () {
        var formaPagamento = document.getElementById("forma_pagamento");
        var campoBandeira = document.getElementById("campo_bandeira");
        var formasComBandeira = ["cartao_credito", "cartao_debito"];

        function atualizarVisibilidade() {
            campoBandeira.hidden = formasComBandeira.indexOf(formaPagamento.value) === -1;
        }

        formaPagamento.addEventListener("change", atualizarVisibilidade);
        atualizarVisibilidade();
    })();
</script>
{% endblock %}
