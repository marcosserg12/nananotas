<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nana Lanches{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            50: '#F7F6F5', 100: '#EDEBE9', 200: '#D9D5D1',
                            500: '#6B6461', 600: '#4A4442', 700: '#2E2A28', 800: '#181513',
                        },
                        red: { 600: '#9E1B2B', 700: '#7A1220' },
                        emerald: { 700: '#1F6B41' },
                        amber: { 700: '#9A5B00' },
                        brand: { 50: '#FDECEC', 100: '#FBD3D5', 300: '#EC7F86', 500: '#C8102E', 600: '#A80D26', 700: '#7E0A1D', 900: '#3D0510' },
                    },
                    fontFamily: {
                        display: ["Bebas Neue", "ui-sans-serif", "sans-serif"],
                        sans: ["Public Sans", "ui-sans-serif", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --brand: #C8102E;
            --ink: #181513;
            --shadow-warm: 0 1px 2px rgba(24, 21, 19, .06), 0 12px 26px -14px rgba(24, 21, 19, .3);
        }

        /* Base de leitura bem maior em todo o site -- pedido explícito por
           conta de baixa visão de quem usa o sistema no dia a dia. Como
           todas as classes do Tailwind (texto, espaçamento, ícones em rem)
           são relativas ao tamanho da fonte do <html>, aumentar aqui
           escala o site inteiro de uma vez -- textos, botões, campos e
           cartões -- em vez de ter que aumentar cada tela na mão. */
        html {
            font-size: 130%;
        }
        @media (max-width: 480px) {
            /* Em telas bem estreitas, 130% pode forçar quebras de linha
               demais nos botões -- 122% ainda é bem maior que o padrão,
               mas sobra mais espaço horizontal pros elementos. */
            html { font-size: 122%; }
        }

        body {
            font-family: 'Public Sans', ui-sans-serif, sans-serif;
            background-color: #FAFAF9;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Bebas Neue', ui-sans-serif, sans-serif;
            letter-spacing: .01em;
        }

        main {
            position: relative;
            z-index: 1;
            animation: subir .5s ease both;
        }

        @keyframes subir {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .rounded { border-radius: .6rem !important; }
        .shadow { box-shadow: var(--shadow-warm) !important; border: 1px solid rgba(24, 21, 19, .07); }

        thead th {
            text-transform: uppercase;
            font-size: .82rem;
            letter-spacing: .06em;
            font-weight: 700;
            color: #4A4442;
        }

        tbody tr { transition: background-color .12s ease; }
        tbody tr:hover { background-color: #FDECEC; }

        /* Tabelas nunca "quebram" o layout no celular. Em telas largas
           ainda tem o scroll horizontal de segurança (`overflow-x`), mas o
           de verdade é abaixo: em telas estreitas a tabela vira uma lista
           de cartões, uma linha por cartão, cada valor com o nome da coluna
           do lado -- lê muito melhor que rolar de lado tentando comparar
           colunas cortadas, especialmente pra quem tem dificuldade de
           leitura na tela pequena. */
        .tabela-scroll {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        @media (max-width: 640px) {
            .tabela-scroll table { width: 100%; }
            .tabela-scroll thead { display: none; }
            .tabela-scroll tbody, .tabela-scroll tr, .tabela-scroll td {
                display: block;
                width: 100%;
            }
            .tabela-scroll tr {
                border-bottom: 1px solid #EDEBE9;
                padding: .5rem 0;
            }
            .tabela-scroll tr:first-child { border-top: 1px solid #EDEBE9; }
            .tabela-scroll td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: .75rem;
                padding: .3rem .9rem;
                border: none !important;
                text-align: right;
            }
            .tabela-scroll td[data-label]::before {
                content: attr(data-label);
                font-weight: 700;
                font-size: .72rem;
                text-transform: uppercase;
                letter-spacing: .04em;
                color: #6B6461;
                text-align: left;
                margin-right: .75rem;
                flex-shrink: 0;
            }
        }

        input[type="text"], input[type="password"], input[type="date"],
        input[type="email"], input[type="number"], select, textarea {
            transition: border-color .15s ease, box-shadow .15s ease;
            background-color: #FFFFFF;
            font-size: 1rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #C8102E !important;
            box-shadow: 0 0 0 3px rgba(200, 16, 46, .16);
        }

        button, .btn, a.inline-block, a.inline-flex {
            font-size: 1rem;
        }

        a[class*="bg-"], button[class*="bg-"] {
            transition: transform .12s ease, box-shadow .2s ease, filter .15s ease;
        }
        a[class*="bg-"]:hover, button[class*="bg-"]:hover {
            filter: brightness(1.1);
            box-shadow: 0 8px 20px -8px rgba(24, 21, 19, .4);
        }
        a[class*="bg-"]:active, button[class*="bg-"]:active { transform: translateY(1px); }

        .marca {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.9rem;
            letter-spacing: .04em;
            line-height: 1;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .55rem .85rem;
            border-radius: .5rem;
            color: rgba(255, 255, 255, .88);
            transition: background-color .15s ease, color .15s ease;
            font-size: 1.05rem;
            font-weight: 500;
        }
        .nav-link:hover { color: #FFFFFF; background-color: rgba(255, 255, 255, .12); }
        .nav-link.ativo { color: #7E0A1D; background-color: #FFFFFF; }
        .nav-link svg { flex-shrink: 0; }
        .nav-link.w-full { justify-content: flex-start; }

        /* Menu do celular: uma coluna só, empilhado, recolhido por padrão --
           classe própria (não a `hidden`/`flex` do Tailwind) pra não ter
           duas regras de `display` brigando pela mesma prioridade. */
        #menu_nav {
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: .3rem;
            margin-top: .85rem;
        }
        #menu_nav.aberto { display: flex; }
        @media (min-width: 640px) {
            #menu_nav {
                display: flex !important;
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                gap: .5rem;
                margin-top: 0;
            }
        }

        /* Botão flutuante de "Nova Venda" -- é a ação mais usada do sistema,
           então fica sempre à mão, em qualquer tela, sem precisar rolar até
           o menu -- especialmente importante no celular. */
        .fab-nova-venda {
            position: fixed;
            right: 1.1rem;
            bottom: 1.1rem;
            z-index: 50;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            background-color: #C8102E;
            color: #FFFFFF;
            padding: 1rem 1.4rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.05rem;
            text-decoration: none;
            box-shadow: 0 14px 28px -8px rgba(24, 21, 19, .5), 0 2px 8px rgba(24, 21, 19, .3);
            transition: transform .15s ease, box-shadow .2s ease, filter .15s ease;
        }
        .fab-nova-venda:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .fab-nova-venda:active { transform: translateY(1px); }
        .fab-nova-venda svg { flex-shrink: 0; }

        /* Modal de confirmação com a cara do sistema, no lugar do
           confirm() nativo do navegador (cinza, sem marca, sem leitura
           fácil pra quem tem baixa visão). Usado por qualquer <form> que
           tenha o atributo `data-confirm-mensagem`. */
        .modal-confirmar {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-confirmar[hidden] { display: none; }
        .modal-confirmar-fundo {
            position: absolute;
            inset: 0;
            background: rgba(24, 21, 19, .6);
            backdrop-filter: blur(2px);
            animation: modalFundo .18s ease both;
        }
        @keyframes modalFundo { from { opacity: 0; } to { opacity: 1; } }
        .modal-confirmar-caixa {
            position: relative;
            background: #FFFFFF;
            border-radius: .9rem;
            max-width: 23rem;
            width: 100%;
            padding: 1.75rem 1.5rem 1.5rem;
            text-align: center;
            border-top: .4rem solid #C8102E;
            box-shadow: 0 24px 48px -12px rgba(24, 21, 19, .5);
            animation: modalCaixa .22s cubic-bezier(.16, 1, .3, 1) both;
        }
        @keyframes modalCaixa {
            from { opacity: 0; transform: translateY(10px) scale(.96); }
            to { opacity: 1; transform: none; }
        }
        .modal-confirmar-icone {
            width: 3.2rem;
            height: 3.2rem;
            margin: 0 auto .9rem;
            border-radius: 999px;
            background: #FDECEC;
            color: #C8102E;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-confirmar-titulo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.7rem;
            letter-spacing: .02em;
            margin-bottom: .4rem;
        }
        .modal-confirmar-texto {
            color: #4A4442;
            font-size: 1rem;
            line-height: 1.45;
            margin-bottom: 1.5rem;
        }
        .modal-confirmar-botoes {
            display: flex;
            flex-direction: column;
            gap: .6rem;
        }
        .modal-confirmar-btn {
            padding: .85rem 1rem;
            border-radius: .6rem;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: filter .15s ease, transform .12s ease, box-shadow .2s ease;
        }
        .modal-confirmar-btn:active { transform: translateY(1px); }
        .modal-confirmar-btn-cancelar {
            background: #F7F6F5;
            color: #181513;
            border: 1px solid #D9D5D1;
        }
        .modal-confirmar-btn-cancelar:hover { background: #EDEBE9; }
        .modal-confirmar-btn-confirmar {
            background: #C8102E;
            color: #FFFFFF;
            border: none;
        }
        .modal-confirmar-btn-confirmar:hover { filter: brightness(1.1); box-shadow: 0 8px 20px -8px rgba(24, 21, 19, .4); }

        [data-total-chance] {
            display: inline-block;
            font-weight: 700;
            color: #4A4442;
        }
        [data-total-chance].aviso-chance-acima {
            color: #C8102E;
        }
    </style>
</head>
<body class="text-slate-800">
    {% if request.session.get("user_id") %}
    {% set caminho = request.url.path %}
    <nav class="bg-brand-500 px-4 sm:px-6 py-3">
        <div class="flex items-center justify-between">
            <span class="marca text-white">NANA LANCHES</span>
            <button type="button" id="botao_menu" class="sm:hidden text-white p-1" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu_nav">
                <svg id="icone_menu_abrir" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                <svg id="icone_menu_fechar" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" hidden><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div id="menu_nav">
            <a href="/" class="nav-link {{ 'ativo' if caminho == '/' else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                Painel
            </a>
            <a href="/produtos" class="nav-link {{ 'ativo' if caminho.startswith('/produtos') else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.6 12.6 12.6 20.6a2 2 0 0 1-2.8 0l-6.4-6.4a2 2 0 0 1 0-2.8l8-8a2 2 0 0 1 1.4-.6H19a1.6 1.6 0 0 1 1.6 1.6v6.8a2 2 0 0 1-.6 1.4Z"/><circle cx="15" cy="9" r="1.4" fill="currentColor" stroke="none"/></svg>
                Produtos
            </a>
            <a href="/clientes" class="nav-link {{ 'ativo' if caminho.startswith('/clientes') else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 19c.6-3 3-5 6.2-5s5.6 2 6.2 5"/><path d="M16.2 4.2c1.6.3 2.8 1.7 2.8 3.4s-1.2 3.1-2.8 3.4"/><path d="M18 14.3c1.9.5 3.4 1.9 3.8 4.2"/></svg>
                Clientes
            </a>
            <a href="/vendas/nova" class="nav-link {{ 'ativo' if caminho == '/vendas/nova' else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.2"/><path d="M12 8v8M8 12h8"/></svg>
                Nova Venda
            </a>
            <a href="/vendas/orcamentos" class="nav-link {{ 'ativo' if caminho == '/vendas/orcamentos' else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 3v2h6V3M8 9h8M8 13h8M8 17h5"/></svg>
                Orçamentos
            </a>
            <a href="/vendas/notas" class="nav-link {{ 'ativo' if caminho.startswith('/vendas/notas') else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M9 9h6M9 13h6M9 17h3.5"/></svg>
                Notas Fiscais
            </a>
            <a href="/configuracoes" class="nav-link {{ 'ativo' if caminho == '/configuracoes' else '' }}">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Configurações
            </a>
            <form method="post" action="/logout" class="sm:ml-auto">
                <button type="submit" class="nav-link w-full sm:w-auto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                    Sair
                </button>
            </form>
        </div>
    </nav>
    <script>
        (function () {
            var botao = document.getElementById("botao_menu");
            var menu = document.getElementById("menu_nav");
            var iconeAbrir = document.getElementById("icone_menu_abrir");
            var iconeFechar = document.getElementById("icone_menu_fechar");
            botao.addEventListener("click", function () {
                var vaiAbrir = !menu.classList.contains("aberto");
                menu.classList.toggle("aberto");
                iconeAbrir.hidden = vaiAbrir;
                iconeFechar.hidden = !vaiAbrir;
                botao.setAttribute("aria-expanded", vaiAbrir ? "true" : "false");
            });
        })();
    </script>
    <a href="/vendas/nova" class="fab-nova-venda">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.2"/><path d="M12 8v8M8 12h8"/></svg>
        Nova Venda
    </a>
    <div id="modal_confirmar" class="modal-confirmar" hidden>
        <div class="modal-confirmar-fundo" data-modal-fechar></div>
        <div class="modal-confirmar-caixa" role="alertdialog" aria-modal="true" aria-labelledby="modal_confirmar_titulo" aria-describedby="modal_confirmar_texto">
            <div class="modal-confirmar-icone">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
            </div>
            <h2 id="modal_confirmar_titulo" class="modal-confirmar-titulo">Tem certeza?</h2>
            <p id="modal_confirmar_texto" class="modal-confirmar-texto"></p>
            <div class="modal-confirmar-botoes">
                <button type="button" id="modal_confirmar_cancelar" class="modal-confirmar-btn modal-confirmar-btn-cancelar">Cancelar</button>
                <button type="button" id="modal_confirmar_confirmar" class="modal-confirmar-btn modal-confirmar-btn-confirmar">Sim, tenho certeza</button>
            </div>
        </div>
    </div>
    <script>
        (function () {
            var modal = document.getElementById("modal_confirmar");
            var texto = document.getElementById("modal_confirmar_texto");
            var botaoConfirmar = document.getElementById("modal_confirmar_confirmar");
            var botaoCancelar = document.getElementById("modal_confirmar_cancelar");
            var formPendente = null;

            function abrirModal(mensagem, form) {
                texto.textContent = mensagem;
                formPendente = form;
                modal.hidden = false;
                botaoCancelar.focus();
                document.body.style.overflow = "hidden";
            }

            function fecharModal() {
                modal.hidden = true;
                formPendente = null;
                document.body.style.overflow = "";
            }

            botaoCancelar.addEventListener("click", fecharModal);
            modal.querySelector("[data-modal-fechar]").addEventListener("click", fecharModal);
            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape" && !modal.hidden) fecharModal();
            });
            botaoConfirmar.addEventListener("click", function () {
                var form = formPendente;
                fecharModal();
                if (form) {
                    if (form.hasAttribute("data-sair-intencional")) {
                        window.dispatchEvent(new Event("app:saida-confirmada"));
                    }
                    form.dataset.confirmado = "1";
                    form.requestSubmit();
                }
            });

            // Qualquer <form> com `data-confirm-mensagem` passa por aqui em
            // vez do confirm() nativo do navegador -- sem marca, sem
            // acessibilidade, e no celular fica minúsculo.
            document.addEventListener("submit", function (event) {
                var form = event.target;
                if (!form.dataset) return;
                if (form.dataset.confirmMensagem && form.dataset.confirmado !== "1") {
                    event.preventDefault();
                    abrirModal(form.dataset.confirmMensagem, form);
                } else if (form.dataset.confirmado === "1") {
                    delete form.dataset.confirmado;
                }
            });
        })();
    </script>
    <script>
        // Usado nas telas do gerador de valor (Produtos > Gerador de valor, e o
        // ajuste "só desta nota" no orçamento): cada campo de "chance (%)" é
        // livre (não mexe nos outros -- editar refeição não devia bagunçar o
        // padrão que já tava certo em lanches, água etc.). Só soma tudo e
        // avisa quando passar de 100%, sem travar nem reescrever nada sozinho.
        function ativarAvisoDeChance(escopo) {
            var campos = Array.prototype.slice.call(escopo.querySelectorAll("[data-campo-chance]"));
            var aviso = escopo.querySelector("[data-total-chance]");
            if (!campos.length || !aviso) return;

            function valor(campo) {
                var numero = parseInt(campo.value, 10);
                return isNaN(numero) ? 0 : numero;
            }

            function atualizar() {
                var total = campos.reduce(function (soma, campo) { return soma + valor(campo); }, 0);
                aviso.textContent = "Total: " + total + "%" + (total > 100 ? " -- acima de 100%" : "");
                aviso.classList.toggle("aviso-chance-acima", total > 100);
            }

            campos.forEach(function (campo) { campo.addEventListener("input", atualizar); });
            atualizar();
        }
    </script>
    {% endif %}
    <main class="p-4 sm:p-6 max-w-6xl mx-auto" style="padding-bottom: 6rem;">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.addEventListener("click", function (event) {
            var clienteItem = event.target.closest("[data-cliente-select]");
            if (clienteItem) {
                document.getElementById("cliente_id").value = clienteItem.dataset.clienteId;
                document.getElementById("cliente_busca").value = clienteItem.dataset.clienteLabel;
                document.getElementById("resultado_busca_cliente").innerHTML = "";
            }
        });
    </script>
</body>
</html>
