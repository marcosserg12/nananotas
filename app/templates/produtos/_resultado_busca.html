{% if produtos or termo %}
<ul class="border rounded bg-white divide-y">
    {% if not produtos %}
    <li class="p-2 text-slate-500 text-sm">Nenhum produto encontrado</li>
    {% endif %}
    {% for produto in produtos %}
    <li class="p-2 hover:bg-slate-50 cursor-pointer"
        data-produto-select
        data-produto-id="{{ produto.id }}"
        data-produto-label="{{ produto.nome }} ({{ produto.codigo_interno }})"
        data-produto-preco="{{ produto.preco_venda }}">
        {{ produto.nome }} — {{ produto.codigo_interno }} — R$ {{ "%.2f"|format(produto.preco_venda) }}
    </li>
    {% endfor %}
</ul>
{% endif %}
