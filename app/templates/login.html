{% extends "base.html" %}
{% block title %}Entrar - Nana Lanches{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="w-full max-w-sm">
        <p class="font-display text-6xl text-brand-500 text-center mb-1">NANA LANCHES</p>
        <p class="text-center text-slate-500 mb-6 text-sm tracking-wide uppercase">Painel do estabelecimento</p>
        <div class="bg-white p-7 rounded shadow border-t-4 border-brand-500">
            {% if erro %}
            <p class="text-red-600 mb-4 text-sm">{{ erro }}</p>
            {% endif %}
            <form method="post" action="/login" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium mb-1">Usuário</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium mb-1">Senha</label>
                    <input type="password" id="senha" name="senha" required autocomplete="current-password" class="w-full border rounded px-3 py-2">
                </div>
                <button type="submit" class="w-full bg-brand-500 text-white py-2.5 rounded font-medium">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
